<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Decrees Dashboard</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.63.1/build/stlite.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.63.1/build/stlite.js"></script>
    <script>
      stlite.mount(
        {
          requirements: ["pandas"],
          entrypoint: "dashboard.py",
          files: {
            "dashboard.py": {
              url: "dashboard.py",
            },
            "output.csv": {
              url: "output.csv",
            },
            "tamogatasok_hoterkep.html": {
              url: "tamogatasok_hoterkep.html",
            },
          },
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
